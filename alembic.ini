
; Alembic configuration file
; Used to configure database migrations.

[alembic]

; Location of Alembic migration scripts
script_location = %(here)s/alembic

; Add project root directory to Python import path
prepend_sys_path = .

; Use operating system path separator
path_separator = os

; Database URL is configured dynamically in alembic/env.py
sqlalchemy.url =


; Logger configuration
[loggers]
keys = root,sqlalchemy,alembic


; Logging handlers
[handlers]
keys = console


; Logging formatters
[formatters]
keys = generic


; Root logger configuration
[logger_root]
level = WARN
handlers = console
qualname =


; SQLAlchemy logger configuration
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


; Alembic logger configuration
[logger_alembic]
level = INFO
handlers = console
qualname = alembic


; Console handler configuration
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


; Generic log message format
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
